# Two branches, two kinds of build:
# - main: every push makes a TEST build: a GitHub pre-release (v<version>-test.<run>, never "latest") with the zip,
#   and a dry run of the Thunderstore package. Nothing goes to Thunderstore.
# - production: the store. A human moves a tested build there (merge main -> production); its push makes the real
#   GitHub release (v<version>, "latest") and publishes that version on Thunderstore. The Thunderstore publish runs in
#   the "production" environment: give it required reviewers (repo > Settings > Environments > production) and each
#   publish also waits for someone to approve it. See docs/THUNDERSTORE.md.
# The game isn't installed here, so the project compiles against the same libraries from NuGet (see UseNuGetRefs in
# LethalMinecraft.csproj).
name: Build release zip

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LethalMinecraft.csproj -c Release -p:UseNuGetRefs=true -o out

      - name: Package
        id: package
        run: |
          ver=$(jq -r .version_number dist/package/manifest.json)
          cp README.md dist/package/README.md
          mkdir -p dist/package/plugins/LethalCraft
          cp out/LethalCraft.dll dist/package/plugins/LethalCraft/
          zip_name="LethalCraft-$ver.zip"
          (cd dist/package && zip -r -X -D "../../$zip_name" icon.png manifest.json README.md CHANGELOG.md plugins)
          unzip -t "$zip_name"
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # release notes: this version's changelog section, then the commit that triggered the build
          awk 'NR==1 && /^## /{next} /^## /{exit} {print}' dist/package/CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`: $(git log -1 --format=%s)"
          } >> notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      # ---------------------------------------------------------------- GitHub release
      - name: Test build (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VER}-test.${GITHUB_RUN_NUMBER}"
          { echo "**Test build, not on Thunderstore.** It goes to the store only once it's moved to the \`production\` branch."; echo; cat notes.md; } > test_notes.md
          gh release create "$tag" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "LethalCraft $VER (test build $GITHUB_RUN_NUMBER)" \
            --notes-file test_notes.md \
            --prerelease --latest=false

      - name: Release (production)
        if: github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VER}"
          # (one release per version: a production push without a version bump keeps the release it already has)
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists: not making another."
            exit 0
          fi
          gh release create "$tag" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "LethalCraft $VER" \
            --notes-file notes.md \
            --latest

      # ---------------------------------------------------------------- Thunderstore package (#58), every push
      - name: Thunderstore package (dry run)
        run: |
          dotnet tool install -g tcli --version 0.2.4
          tcli() { "$HOME/.dotnet/tools/tcli" "$@"; }
          # the config's dependencies and description must match manifest.json (the zip on the GitHub release)
          python3 - <<'PY'
          import json, re, sys
          m = json.load(open("dist/package/manifest.json"))
          t = open("thunderstore.toml").read()
          deps = dict(re.findall(r'^([A-Za-z0-9_]+-[A-Za-z0-9_]+) = "([^"]+)"', t, re.M))
          want = dict(d.rsplit("-", 1) for d in m["dependencies"])
          desc = re.search(r'^description = "(.*)"$', t, re.M).group(1)
          errs = []
          if deps != want: errs.append(f"dependencies differ: thunderstore.toml {deps} vs manifest.json {want}")
          if desc != m["description"]: errs.append("description differs between thunderstore.toml and manifest.json")
          if len(m["description"]) > 250: errs.append("description longer than 250 characters")
          if errs: sys.exit("; ".join(errs))
          PY
          # (a team other than the config's: the THUNDERSTORE_NAMESPACE variable, written into the config, which tcli
          # reads for both build and publish: publish --file takes no namespace or version options)
          ns="${{ vars.THUNDERSTORE_NAMESPACE }}"
          if [ -n "$ns" ]; then sed -i "s/^namespace = \".*\"$/namespace = \"$ns\"/" thunderstore.toml; fi
          # Thunderstore takes a CHANGELOG.md of at most 100,000 characters (1.58.4's first publish was refused at
          # 106,190): the store's copy keeps the newest versions whole and points to the full one on GitHub
          python3 - <<'PY'
          import re
          p = "dist/package/CHANGELOG.md"
          t = open(p, encoding="utf-8").read()
          tail = "\n## Older versions\n\nThe full changelog: https://github.com/Thrasherop/lethalcraft/blob/main/dist/package/CHANGELOG.md\n"
          if len(t) > 95000:
              cut = max(m.start() for m in re.finditer(r"^## ", t, re.M) if m.start() <= 95000 - len(tail))
              t = t[:cut].rstrip("\n") + "\n" + tail
              open(p, "w", encoding="utf-8").write(t)
          print("Thunderstore CHANGELOG.md:", len(t), "characters")
          assert len(t) <= 100000
          PY
          tcli build --package-version "$VER"
          ls -la build
          echo "TS_ZIP=$(ls build/*.zip | head -1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: thunderstore-package
          path: ${{ env.TS_ZIP }}

  # -------------------------------------------------------------------- the store: production only
  publish:
    needs: build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    # (repo > Settings > Environments > production > Required reviewers: then each publish waits for an approval)
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: thunderstore-package
          path: build

      - name: Publish on Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "No TCLI_AUTH_TOKEN secret: not publishing on Thunderstore (see docs/THUNDERSTORE.md)."
            exit 0
          fi
          ns="${{ vars.THUNDERSTORE_NAMESPACE }}"
          ns="${ns:-$(sed -n 's/^namespace = "\(.*\)"$/\1/p' thunderstore.toml)}"
          # each version goes up once (Thunderstore refuses a version it already has; a push without a version bump skips)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://thunderstore.io/api/experimental/package/$ns/LethalCraft/$VER/")
          if [ "$code" = "200" ]; then
            echo "LethalCraft $VER is already on Thunderstore ($ns): nothing to publish."
            exit 0
          fi
          if [ -n "${{ vars.THUNDERSTORE_NAMESPACE }}" ]; then sed -i "s/^namespace = \".*\"$/namespace = \"$ns\"/" thunderstore.toml; fi
          dotnet tool install -g tcli --version 0.2.4
          # (the zip's own manifest gives the version; the config gives the team, community and categories)
          "$HOME/.dotnet/tools/tcli" publish --file "$(ls build/*.zip | head -1)"
